<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>NEXUS — Gestion des Cotisations</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;700;900&family=Rajdhani:wght@300;400;500;600&display=swap" rel="stylesheet"/>

<!-- ⚠️ STYLE IDENTIQUE (inchangé) -->
<style>
/* GARDE TON CSS EXACT (je n’y touche pas) */
</style>
</head>

<body>

<!-- ⚠️ GARDE TOUT TON HTML EXACT (sidebar, pages, etc.) -->

<script>
/* =========================
   🔥 CONFIG API
========================= */
const API = "";

/* =========================
   🔥 ETAT GLOBAL
========================= */
let state = {
  membres: [],
  cotisations: [],
  depenses: []
};

/* =========================
   🔥 API HELPERS
========================= */
async function apiGet(url){
  const res = await fetch(API + url);
  return await res.json();
}

async function apiPost(url, data){
  const res = await fetch(API + url, {
    method: "POST",
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify(data)
  });
  return await res.json();
}

/* =========================
   🔥 LOAD DATA FROM SERVER
========================= */
async function loadState(){
  try{
    const data = await apiGet("/dashboard");

    state.membres = data.membres || [];
    state.total_cotisations = data.total_cotisations || 0;
    state.total_depenses = data.total_depenses || 0;
    state.solde = data.solde || 0;

    render();

  }catch(e){
    console.error(e);
    alert("Erreur connexion serveur");
  }
}

/* =========================
   🔥 ACTIONS
========================= */

async function ajouterMembre(){
  const nom = document.getElementById('m-nom').value.trim();
  const tel = document.getElementById('m-tel').value.trim();
  const montant = parseFloat(document.getElementById('m-montant').value)||5000;

  if(!nom) return alert("Nom requis");

  await apiPost("/membre", {nom, tel, montant});

  document.getElementById('m-nom').value='';
  document.getElementById('m-tel').value='';

  loadState();
}

async function ajouterCotisation(){
  const membre_id = parseInt(document.getElementById('c-membre').value);
  const montant = parseFloat(document.getElementById('c-montant').value);
  const periode = document.getElementById('c-periode').value;

  if(!membre_id) return alert("Choisir membre");

  await apiPost("/cotisation", {membre_id, montant, periode});

  document.getElementById('c-montant').value='';
  document.getElementById('c-periode').value='';

  loadState();
}

async function ajouterDepense(){
  const motif = document.getElementById('d-motif').value;
  const montant = parseFloat(document.getElementById('d-montant').value);
  const par = document.getElementById('d-par').value;

  if(!motif) return alert("Motif requis");

  await apiPost("/depense", {motif, montant, par});

  document.getElementById('d-motif').value='';
  document.getElementById('d-montant').value='';
  document.getElementById('d-par').value='';

  loadState();
}

/* =========================
   🔥 RENDER SIMPLE
========================= */

function render(){

  const totalCot = state.total_cotisations || 0;
  const totalDep = state.total_depenses || 0;
  const solde = state.solde || 0;

  document.getElementById("sidebar-solde").innerText = totalCot - totalDep + " FCFA";
  document.getElementById("sidebar-membres").innerText = state.membres.length + " membres";

  renderMembres();
}

function renderMembres(){

  const list = document.getElementById("membres-list");
  if(!list) return;

  if(state.membres.length === 0){
    list.innerHTML = "<p>Aucun membre</p>";
    return;
  }

  list.innerHTML = state.membres.map(m => `
    <div style="margin-bottom:10px">
      <b>${m.nom}</b> — Dette: ${m.dette} FCFA
    </div>
  `).join("");

  const select = document.getElementById("c-membre");
  if(select){
    select.innerHTML = '<option value="">Choisir</option>' +
      state.membres.map(m=>`<option value="${m.id}">${m.nom}</option>`).join('');
  }
}

/* =========================
   🚀 INIT
========================= */
loadState();

</script>

</body>
</html>
